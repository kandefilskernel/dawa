services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: dawa
      POSTGRES_USER: dawa
      POSTGRES_PASSWORD: dawa
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawa -d dawa"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
