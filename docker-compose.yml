services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: dawa
      POSTGRES_USER: dawa
      POSTGRES_PASSWORD: dawa
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawa -d dawa"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy

  # Site Next.js des pharmacies, établissements et de l'équipe (dossier web/), http://localhost:3000
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      UZIMA_BACKEND_URL: http://backend:8000
      WATCHPACK_POLLING: "true"   # Windows : les changements de fichiers ne remontent pas sans scrutation
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  web_node_modules:
  web_next:
