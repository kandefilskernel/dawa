name: APK Android

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Adresse de l'API appelée par l'application"
        required: true
        default: "http://10.202.119.131:8010"
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - ".github/workflows/apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    env:
      # Sur un push, pas de saisie : on garde l'IP du PC de démo (même valeur par défaut).
      API_URL: ${{ inputs.api_url || 'http://10.202.119.131:8010' }}
      # Notifications : configuration de l'app Android du projet Firebase dawa-44a42 (google-services.json).
      # Valeurs publiques, intégrées à l'APK ; une variable GitHub du même nom (Settings → Secrets and
      # variables → Actions → Variables) les remplace si besoin.
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || 'AIzaSyDyr81j3femFx-fUyKVO4KBq5f1sEE_2TE' }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || '1:654539355183:android:ff15098dac9b111522c2da' }}
      FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID || '654539355183' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'dawa-44a42' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - run: flutter pub get

      - run: >-
          flutter build apk --release
          --dart-define=API_URL=$API_URL
          --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY
          --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID
          --dart-define=FIREBASE_SENDER_ID=$FIREBASE_SENDER_ID
          --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID

      - run: cp build/app/outputs/flutter-apk/app-release.apk build/dawa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dawa-apk
          path: mobile/build/dawa.apk
          retention-days: 30

      # Release publique : lien de téléchargement sans connexion GitHub.
      # Dernière version toujours sur releases/latest/download/dawa.apk.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Dawa APK ${{ github.run_number }}
          body: "API : ${{ env.API_URL }} — notifications : ${{ env.FIREBASE_PROJECT_ID != '' && 'actives' || 'désactivées' }}"
          files: mobile/build/dawa.apk
          make_latest: true
