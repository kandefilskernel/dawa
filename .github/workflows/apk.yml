name: APK Android

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Adresse de l'API appelée par l'application"
        required: true
        default: "http://10.202.119.131:8010"
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - ".github/workflows/apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # Sur un push, pas de saisie : on garde l'IP du PC de démo (même valeur par défaut).
      API_URL: ${{ inputs.api_url || 'http://10.202.119.131:8010' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release --dart-define=API_URL=$API_URL

      - uses: actions/upload-artifact@v4
        with:
          name: dawa-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
